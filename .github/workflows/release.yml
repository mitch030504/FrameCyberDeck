name: Create Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1) — used as tag (v$VERSION), title, and app version.'
        required: true
        type: string
# push trigger removed — the workflow creates its own tag via gh release create,
# which would otherwise re-trigger this same workflow in an infinite loop.

# Workflow-level write permission so every job inherits it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  bump-version:
    name: Commit version bump to package.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${REF_NAME:-}" == v*.*.* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be a valid semantic version"
            exit 1
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to replace a published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if DRAFT=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$DRAFT" != true ]; then
              echo "::error::Release v$VERSION is already published. Choose a new version."
              exit 1
            fi
          fi

      - name: Write version into package.json and push if changed
        id: push
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euxo pipefail

          # Update package.json to the requested version.
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          echo "package.json is now at: $(node -p "require('./package.json').version")"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- package.json package-lock.json; then
            echo "No version change — package.json already at $VERSION."
            SHA="$(git rev-parse HEAD)"
          else
            git add package.json package-lock.json
            git commit -m "chore: bump version to $VERSION [skip ci]"
            DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
            echo "Pushing version bump to origin/$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
            SHA="$(git rev-parse HEAD)"
          fi

          echo "Bump-version SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build on ${{ matrix.os }}
    needs: bump-version
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    outputs:
      package_version: ${{ steps.build_details.outputs.package_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/cache
            ~/.dmg-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package.json', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Determine build command and artifact path
        id: build_details
        shell: bash
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          set -euxo pipefail
          PRODUCT_NAME="$(node -p "require('./package.json').name")"

          echo "Using version: $VERSION"
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

          OUTPUT_DIR="dist"

          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "BUILD_COMMAND=npx electron-vite build && npx electron-builder --win --x64 --ia32 --publish never" >> "$GITHUB_OUTPUT"
            echo "ARTIFACT_PATH=${OUTPUT_DIR}/${PRODUCT_NAME}-${VERSION}-*.exe" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            echo "BUILD_COMMAND=npx electron-vite build && npx electron-builder --mac --x64 --arm64 --publish never" >> "$GITHUB_OUTPUT"
            echo "ARTIFACT_PATH=${OUTPUT_DIR}/${PRODUCT_NAME}-${VERSION}-*.dmg" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" == "Linux" ]; then
            echo "BUILD_COMMAND=npx electron-vite build && npx electron-builder --linux --x64 --arm64 --publish never" >> "$GITHUB_OUTPUT"
            echo "ARTIFACT_PATH=${OUTPUT_DIR}/${PRODUCT_NAME}-${VERSION}-*.[Ad]*" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-cache arm64 dmg-builder tool (required on ARM64 runner to build any DMG)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          CACHE_DIR="$HOME/Library/Caches/electron-builder/dmg-builder/1.2.0"
          FILE="$CACHE_DIR/dmgbuild-bundle-arm64-75c8a6c.tar.gz"
          mkdir -p "$CACHE_DIR"
          if [ ! -f "$FILE" ]; then
            curl -fL --retry 5 --retry-delay 5 -o "$FILE" \
              "https://github.com/electron-userland/electron-builder-binaries/releases/download/dmg-builder%401.2.0/dmgbuild-bundle-arm64-75c8a6c.tar.gz"
          fi
          ls -lh "$FILE"

      - name: Build application
        env:
          BUILD_COMMAND: ${{ steps.build_details.outputs.BUILD_COMMAND }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VRSRC_API_KEY: ${{ secrets.VRSRC_API_KEY }}
          ELECTRON_BUILDER_DOWNLOAD_TIMEOUT: 120000
          npm_config_fetch_timeout: 120000
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
          npm_config_fetch_retries: 5
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail
          bash .github/scripts/build-with-retries.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.os }}
          path: ${{ steps.build_details.outputs.ARTIFACT_PATH }}
          if-no-files-found: error

  create_release:
    name: Create GitHub Release
    needs: [bump-version, build]
    # Run even if some OS builds failed, so the successful ones can still publish.
    if: always() && needs.bump-version.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.bump-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          fetch-depth: 0

      - name: Sanity-check inputs from previous jobs
        shell: bash
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          TARGET_SHA: ${{ needs.bump-version.outputs.sha }}
        run: |
          set -euxo pipefail
          echo "VERSION='${VERSION}'"
          echo "TARGET_SHA='${TARGET_SHA}'"
          if [ -z "${VERSION}" ]; then
            echo "::error::bump-version did not produce a version output. Aborting."
            exit 1
          fi
          if [ -z "${TARGET_SHA}" ]; then
            echo "::error::bump-version did not produce a sha output. Aborting."
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "Contents of artifacts directory:"
          ls -laR artifacts || true

      - name: Generate release name and changelog via Claude
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node .github/scripts/ai-release-notes.js \
            && echo "Claude generated release notes." \
            || echo "Claude generation failed or skipped — using existing .github/release-name.txt and .github/release-changelog.md"

      - name: Create draft release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.bump-version.outputs.version }}
          TARGET_SHA: ${{ needs.bump-version.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail

          TAG="v${VERSION}"
          echo "Creating draft release $TAG in $REPO at commit $TARGET_SHA"

          mapfile -d '' ASSETS < <(find artifacts -type f -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No successful build artifacts were produced."
            exit 1
          fi
          # An existing tag must identify exactly the code that produced these assets.
          TAG_REF=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$TAG_REF" ]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-parse "$TAG^{commit}")" != "$TARGET_SHA" ]; then
              echo "::error::Existing tag $TAG refers to a different commit."
              exit 1
            fi
          fi
          if DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$DRAFT" != true ]; then
              echo "::error::Refusing to modify published release $TAG."
              exit 1
            fi
            EXISTS=true
          else
            EXISTS=false
          fi

          # Generate release notes from .github/release-name.txt and .github/release-changelog.md
          RELEASE_NAME="$(head -1 .github/release-name.txt | tr -d '\r\n')"
          node .github/scripts/generate-release-notes.js "$VERSION" > release-notes.md

          if [ "$EXISTS" = true ]; then
            gh release edit "$TAG" --repo "$REPO" --draft \
              --title "Release v${VERSION} — ${RELEASE_NAME}" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$REPO" --draft --target "$TARGET_SHA" \
              --title "Release v${VERSION} — ${RELEASE_NAME}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber

          URL="$(gh release view "$TAG" --repo "$REPO" --json url -q .url)"
          echo "Done. Release URL: $URL"

  mac:
    name: Build macOS DMG
    needs: create_release
    if: needs.create_release.result == 'success'
    uses: ./.github/workflows/mac-build.yml
    with:
      version: ${{ needs.create_release.outputs.version }}
    secrets:
      VRSRC_API_KEY: ${{ secrets.VRSRC_API_KEY }}
    permissions:
      contents: write
